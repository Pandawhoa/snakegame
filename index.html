<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>復古貪食蛇 SNAKE-8BIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0a0e14;
    --console:#252c38;
    --console-hi:#323a48;
    --console-dark:#171c24;
    --screen-bg:#0c1420;
    --grid-line:#152030;
    --snake-head:#8aff6e;
    --snake-body:#4ec94a;
    --snake-shadow:#245c24;
    --food:#ff4d4d;
    --special-slow:#4dd8ff;
    --special-shrink:#ff4dd8;
    --special-gold:#ffd23f;
    --special-invincible:#ffffff;
    --obstacle:#5c6472;
    --obstacle-dark:#3c424e;
    --text-primary:#eef2e8;
    --text-dim:#7c8a99;
    --accent:#ffd23f;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(ellipse at center, #14202e 0%, var(--bg-deep) 70%);
    font-family:'Press Start 2P', monospace;
    color:var(--text-primary);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    touch-action:none;
    overscroll-behavior:none;
    user-select:none;
  }

  .console{
    background:linear-gradient(180deg, var(--console-hi), var(--console));
    border-radius:22px;
    padding:16px 16px 20px;
    box-shadow: 0 0 0 2px var(--console-dark), 0 18px 40px rgba(0,0,0,0.6), inset 0 2px 0 rgba(255,255,255,0.06);
    width:min(94vw, 440px);
    display:flex; flex-direction:column; gap:10px;
    position:relative;
  }

  .console::before, .console::after{
    content:''; position:absolute; width:8px; height:8px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #555c68, #10141a);
    top:10px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.4);
  }
  .console::before{ left:12px; }
  .console::after{ right:12px; }

  .topbar{
    display:flex; justify-content:space-between; align-items:center;
    padding:0 4px;
  }
  .brand{ font-size:11px; color:var(--text-dim); letter-spacing:1px; }
  .led{ width:7px; height:7px; border-radius:50%; background:var(--snake-head); box-shadow:0 0 6px 2px var(--snake-head); }

  .hud{
    display:flex; justify-content:space-between;
    background:var(--console-dark);
    border-radius:8px;
    padding:8px 12px;
    font-size:10px;
    color:var(--text-dim);
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
  }
  .hud .val{ color:var(--accent); font-size:12px; display:block; margin-top:4px; }
  .hud .block{ text-align:center; }

  .status{
    min-height:14px;
    text-align:center;
    font-size:8px;
    color:var(--special-invincible);
    letter-spacing:1px;
  }

  .screen{
    position:relative;
    background:var(--screen-bg);
    border-radius:6px;
    overflow:hidden;
    box-shadow: inset 0 0 0 3px var(--console-dark), inset 0 0 30px rgba(0,0,0,0.7);
    line-height:0;
    touch-action:none;
    overscroll-behavior:none;
  }
  .screen.invincible{
    box-shadow: inset 0 0 0 3px var(--special-invincible), inset 0 0 20px rgba(255,255,255,0.4);
  }

  canvas{ display:block; width:100%; height:auto; image-rendering:pixelated; }

  .scanlines{
    position:absolute; inset:0; pointer-events:none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.18) 0px, rgba(0,0,0,0.18) 1px, transparent 2px, transparent 3px);
    mix-blend-mode:overlay;
  }
  .vignette{
    position:absolute; inset:0; pointer-events:none;
    box-shadow: inset 0 0 60px 14px rgba(0,0,0,0.65);
  }

  .flash{
    position:absolute; inset:0; pointer-events:none;
    background:var(--accent); opacity:0;
  }
  .flash.active{ animation:flashPulse 0.4s ease-out; }
  @keyframes flashPulse{ 0%{opacity:0.55;} 100%{opacity:0;} }

  .overlay{
    position:absolute; inset:0;
    background:rgba(6,10,16,0.92);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:20px; gap:12px;
    transition:opacity 0.2s;
    line-height:1.5;
  }
  .overlay.hidden{ display:none; }

  .title{
    font-size: clamp(16px, 5.4vw, 22px);
    color:var(--snake-head);
    text-shadow:0 0 10px rgba(138,255,110,0.6);
    letter-spacing:2px;
  }
  .subtitle{ font-size:9px; color:var(--text-dim); line-height:1.8; }
  .blink{ animation:blink 1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }

  .mode-select{ display:flex; flex-direction:column; gap:10px; width:100%; margin-top:4px; }
  .mode-btn{
    font-family:'Press Start 2P', monospace;
    background:var(--console-dark);
    color:var(--text-primary);
    border:2px solid transparent;
    border-radius:8px;
    padding:10px 8px;
    font-size:9px;
    cursor:pointer;
    line-height:1.6;
  }
  .mode-btn.selected{ border-color:var(--accent); color:var(--accent); }
  .mode-btn small{ display:block; color:var(--text-dim); font-size:7px; margin-top:4px; }
  .mode-btn.selected small{ color:var(--accent); opacity:0.8; }

  .go-score{ font-size:14px; color:var(--food); }
  .go-hi{ font-size:9px; color:var(--accent); min-height:9px; }
  .go-hi:empty{ display:none; }

  .bottombar{
    display:flex; align-items:center; justify-content:space-between;
    padding:2px 4px 0;
    gap:10px;
  }
  .hint{ font-size:7.5px; color:var(--text-dim); line-height:1.6; flex:1; }
  .pixel-btn{
    font-family:'Press Start 2P', monospace;
    background:var(--console-dark);
    color:var(--text-primary);
    border:none; border-radius:6px;
    width:34px; height:34px;
    font-size:12px;
    box-shadow: 0 3px 0 #0a0d12, inset 0 1px 0 rgba(255,255,255,0.08);
    cursor:pointer;
  }
  .pixel-btn:active{ box-shadow:0 1px 0 #0a0d12; transform:translateY(2px); }

  .legend{ display:flex; flex-wrap:wrap; gap:8px 10px; justify-content:center; font-size:6.5px; color:var(--text-dim); }
  .legend span{ display:inline-flex; align-items:center; gap:4px; }
  .dot{ width:7px; height:7px; display:inline-block; }
</style>
</head>
<body>

<div class="console">
  <div class="topbar">
    <div class="brand">SNAKE-8BIT</div>
    <div class="led" id="led"></div>
  </div>

  <div class="hud">
    <div class="block">SCORE<span class="val" id="score">0000</span></div>
    <div class="block">LV<span class="val" id="level">1</span></div>
    <div class="block">HI<span class="val" id="hiscore">0000</span></div>
  </div>
  <div class="status" id="statusRow"></div>

  <div class="screen" id="screen" tabindex="0" style="outline:none;">
    <canvas id="game"></canvas>
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="flash" id="flash"></div>

    <div class="overlay" id="startOverlay">
      <div class="title">SNAKE<br>8-BIT</div>
      <div class="subtitle">
        方向鍵 / WASD 或 螢幕滑動 操控方向・空白鍵暫停<br>
        <span style="color:var(--special-slow)">■</span>減速&nbsp; <span style="color:var(--special-shrink)">■</span>縮身&nbsp; <span style="color:var(--special-gold)">■</span>金幣&nbsp; <span style="color:var(--special-invincible)">■</span>無敵
      </div>
      <div class="mode-select">
        <div class="mode-btn selected" id="modeClassic" data-mode="classic">經典模式<small>純淨場地・專注長度與速度</small></div>
        <div class="mode-btn" id="modeAdvanced" data-mode="advanced">進階模式<small>隨等級提升出現障礙物</small></div>
      </div>
      <div class="btn-start blink" style="font-size:10px; color:var(--accent);">TAP MODE or PRESS ENTER</div>
    </div>

    <div class="overlay hidden" id="pauseOverlay">
      <div class="title" style="font-size:16px;">PAUSED</div>
      <div class="subtitle">按空白鍵或暫停鍵繼續</div>
    </div>

    <div class="overlay hidden" id="gameoverOverlay">
      <div class="title" style="font-size:16px; color:var(--food);">GAME OVER</div>
      <div class="go-score" id="finalScore">SCORE 0000</div>
      <div class="go-hi" id="newHi"></div>
      <div class="btn-start blink">TAP or ENTER TO CONTINUE</div>
    </div>
  </div>

  <div class="bottombar">
    <div class="hint">滑動螢幕轉向・連點兩下暫停</div>
    <button class="pixel-btn" id="pauseBtn">II</button>
  </div>

  <div class="legend">
    <span><i class="dot" style="background:var(--food)"></i>食物</span>
    <span><i class="dot" style="background:var(--special-slow)"></i>減速</span>
    <span><i class="dot" style="background:var(--special-shrink)"></i>縮身</span>
    <span><i class="dot" style="background:var(--special-gold)"></i>金幣+50</span>
    <span><i class="dot" style="background:var(--special-invincible)"></i>無敵</span>
    <span><i class="dot" style="background:var(--obstacle)"></i>障礙物</span>
  </div>
</div>

<script>
(function(){
  const GRID = 20;
  const MIN_INTERVAL = 70;
  const BASE_INTERVAL = 150;
  const SPEEDUP_PER_SEGMENT = 3;
  const MAX_OBSTACLES = 24;

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const screenEl = document.getElementById('screen');
  const scoreEl = document.getElementById('score');
  const levelEl = document.getElementById('level');
  const hiEl = document.getElementById('hiscore');
  const statusRow = document.getElementById('statusRow');
  const flashEl = document.getElementById('flash');
  const startOverlay = document.getElementById('startOverlay');
  const pauseOverlay = document.getElementById('pauseOverlay');
  const gameoverOverlay = document.getElementById('gameoverOverlay');
  const finalScoreEl = document.getElementById('finalScore');
  const newHiEl = document.getElementById('newHi');
  const pauseBtn = document.getElementById('pauseBtn');
  const led = document.getElementById('led');
  const modeClassicBtn = document.getElementById('modeClassic');
  const modeAdvancedBtn = document.getElementById('modeAdvanced');

  let cellSize = 20;
  let hiScore = 0;
  let selectedMode = 'classic';
  let mode = 'classic';

  let state = 'start';
  let snake, dir, nextDir, score, level, foodEatenCount;
  let food, specialFood, obstacles;
  let particles = [];
  let slowUntil = 0;
  let invincibleUntil = 0;
  let lastTime = 0, acc = 0;

  function resize(){
    const maxSize = Math.min(screenEl.clientWidth || 400, 440);
    cellSize = Math.floor(maxSize / GRID);
    const size = cellSize * GRID;
    canvas.width = size;
    canvas.height = size;
    canvas.style.width = '100%';
    canvas.style.height = 'auto';
    draw();
  }
  window.addEventListener('resize', resize);

  function randCell(){
    return { x: Math.floor(Math.random()*GRID), y: Math.floor(Math.random()*GRID) };
  }

  function cellOccupied(cell){
    if (snake.some(s => s.x===cell.x && s.y===cell.y)) return true;
    if (food && food.x===cell.x && food.y===cell.y) return true;
    if (specialFood && specialFood.x===cell.x && specialFood.y===cell.y) return true;
    if (obstacles.some(o => o.x===cell.x && o.y===cell.y)) return true;
    return false;
  }

  function spawnFood(){
    let c;
    do { c = randCell(); } while(cellOccupied(c));
    food = c;
  }

  function pickSpecialType(){
    const r = Math.random();
    if (r < 0.35) return 'slow';
    if (r < 0.70) return 'shrink';
    if (r < 0.90) return 'gold';
    return 'invincible';
  }

  function trySpawnSpecial(){
    if (specialFood) return;
    if (Math.random() > 0.6) return;
    let c;
    do { c = randCell(); } while(cellOccupied(c));
    const type = pickSpecialType();
    specialFood = { x:c.x, y:c.y, type, expireAt: performance.now() + 5500 };
  }

  function addObstacles(count){
    const head = snake[0];
    let added = 0, attempts = 0;
    while (added < count && obstacles.length < MAX_OBSTACLES && attempts < 200){
      attempts++;
      const c = randCell();
      const distToHead = Math.abs(c.x-head.x) + Math.abs(c.y-head.y);
      if (distToHead < 3) continue;
      if (cellOccupied(c)) continue;
      obstacles.push(c);
      added++;
    }
  }

  function reset(){
    const cx = Math.floor(GRID/2);
    const cy = Math.floor(GRID/2);
    snake = [ {x:cx-1,y:cy}, {x:cx-2,y:cy}, {x:cx-3,y:cy} ];
    dir = {x:1,y:0};
    nextDir = {x:1,y:0};
    score = 0;
    level = 1;
    foodEatenCount = 0;
    specialFood = null;
    obstacles = [];
    slowUntil = 0;
    invincibleUntil = 0;
    particles = [];
    spawnFood();
    updateHud();
  }

  function updateHud(){
    scoreEl.textContent = String(score).padStart(4,'0');
    levelEl.textContent = level;
    hiEl.textContent = String(hiScore).padStart(4,'0');

    const now = performance.now();
    const statuses = [];
    if (now < slowUntil) statuses.push('減速中 ' + Math.ceil((slowUntil-now)/1000) + 's');
    if (now < invincibleUntil) statuses.push('無敵 ' + Math.ceil((invincibleUntil-now)/1000) + 's');
    statusRow.textContent = statuses.join('   ');
    screenEl.classList.toggle('invincible', now < invincibleUntil);
  }

  function currentInterval(){
    let interval = Math.max(MIN_INTERVAL, BASE_INTERVAL - (snake.length-3)*SPEEDUP_PER_SEGMENT);
    if (performance.now() < slowUntil) interval *= 1.45;
    return interval;
  }

  function spawnParticles(x, y, color){
    const cx = x*cellSize + cellSize/2;
    const cy = y*cellSize + cellSize/2;
    for(let i=0;i<10;i++){
      const angle = Math.random()*Math.PI*2;
      const speed = 0.6 + Math.random()*1.6;
      particles.push({
        x:cx, y:cy,
        vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed,
        life:1, color
      });
    }
  }

  function triggerFlash(){
    flashEl.classList.remove('active');
    void flashEl.offsetWidth;
    flashEl.classList.add('active');
  }

  function step(){
    dir = nextDir;
    let head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    const now = performance.now();
    const invincible = now < invincibleUntil;

    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID){
      if (invincible){
        head.x = (head.x + GRID) % GRID;
        head.y = (head.y + GRID) % GRID;
      } else {
        return gameOver();
      }
    }

    const hitsSelf = snake.some(s => s.x===head.x && s.y===head.y);
    const hitsObstacle = obstacles.some(o => o.x===head.x && o.y===head.y);
    if ((hitsSelf || hitsObstacle) && !invincible){
      return gameOver();
    }

    snake.unshift(head);

    let grew = false;
    if (head.x===food.x && head.y===food.y){
      score += 10;
      foodEatenCount++;
      spawnParticles(food.x, food.y, getCssVar('--food'));
      spawnFood();
      grew = true;
      if (foodEatenCount % 5 === 0) trySpawnSpecial();
      const newLevel = Math.floor(score/50)+1;
      if (newLevel !== level){
        level = newLevel;
        triggerFlash();
        if (mode === 'advanced') addObstacles(2);
      }
    } else if (specialFood && head.x===specialFood.x && head.y===specialFood.y){
      if (specialFood.type === 'slow'){
        slowUntil = now + 5000;
        spawnParticles(specialFood.x, specialFood.y, getCssVar('--special-slow'));
      } else if (specialFood.type === 'shrink'){
        spawnParticles(specialFood.x, specialFood.y, getCssVar('--special-shrink'));
        const shrinkTo = Math.max(3, snake.length - 3);
        while (snake.length > shrinkTo) snake.pop();
      } else if (specialFood.type === 'gold'){
        score += 50;
        spawnParticles(specialFood.x, specialFood.y, getCssVar('--special-gold'));
      } else if (specialFood.type === 'invincible'){
        invincibleUntil = now + 5000;
        spawnParticles(specialFood.x, specialFood.y, getCssVar('--special-invincible'));
      }
      specialFood = null;
      grew = true;
    }

    if (!grew){
      snake.pop();
    }

    if (specialFood && now > specialFood.expireAt){
      specialFood = null;
    }

    updateHud();
  }

  function getCssVar(name){
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function gameOver(){
    state = 'gameover';
    let isNew = false;
    if (score > hiScore){ hiScore = score; isNew = true; }
    updateHud();
    finalScoreEl.textContent = 'SCORE ' + String(score).padStart(4,'0');
    newHiEl.textContent = '';
    if (isNew) newHiEl.textContent = 'NEW HIGH SCORE!';
    gameoverOverlay.classList.remove('hidden');
    led.style.background = '#ff4d4d';
    led.style.boxShadow = '0 0 6px 2px #ff4d4d';
  }

  function updateParticles(dt){
    particles.forEach(p=>{
      p.x += p.vx*dt*0.06;
      p.y += p.vy*dt*0.06;
      p.life -= dt*0.0025;
    });
    particles = particles.filter(p=>p.life>0);
  }

  function drawCell(x,y,color,inset){
    const pad = inset || 1;
    ctx.fillStyle = color;
    ctx.fillRect(x*cellSize+pad, y*cellSize+pad, cellSize-pad*2, cellSize-pad*2);
  }

  function draw(){
    ctx.fillStyle = getCssVar('--screen-bg') || '#0c1420';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.strokeStyle = getCssVar('--grid-line') || '#152030';
    ctx.lineWidth = 1;
    for(let i=0;i<=GRID;i++){
      ctx.beginPath(); ctx.moveTo(i*cellSize,0); ctx.lineTo(i*cellSize,canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0,i*cellSize); ctx.lineTo(canvas.width,i*cellSize); ctx.stroke();
    }

    if (obstacles){
      obstacles.forEach(o=>{
        ctx.fillStyle = getCssVar('--obstacle');
        ctx.fillRect(o.x*cellSize+1, o.y*cellSize+1, cellSize-2, cellSize-2);
        ctx.strokeStyle = getCssVar('--obstacle-dark');
        ctx.lineWidth = 2;
        ctx.strokeRect(o.x*cellSize+3, o.y*cellSize+3, cellSize-6, cellSize-6);
      });
    }

    if (!snake) return;

    const pulse = 2 + Math.sin(performance.now()/150)*1.5;
    if (food){
      ctx.fillStyle = getCssVar('--food');
      ctx.fillRect(food.x*cellSize+pulse, food.y*cellSize+pulse, cellSize-pulse*2, cellSize-pulse*2);
    }

    if (specialFood){
      const remain = specialFood.expireAt - performance.now();
      const blinking = remain < 1500 && Math.floor(performance.now()/150)%2===0;
      if (!blinking){
        const varName = '--special-' + specialFood.type;
        const color = getCssVar(varName);
        ctx.fillStyle = color;
        ctx.fillRect(specialFood.x*cellSize+pulse, specialFood.y*cellSize+pulse, cellSize-pulse*2, cellSize-pulse*2);
      }
    }

    const invincible = performance.now() < invincibleUntil;
    snake.forEach((s,i)=>{
      if (i===0){
        const headColor = invincible && Math.floor(performance.now()/100)%2===0 ? getCssVar('--special-invincible') : getCssVar('--snake-head');
        drawCell(s.x,s.y,headColor,1);
        ctx.fillStyle = getCssVar('--screen-bg');
        const ex = dir.x!==0 ? (dir.x>0? cellSize*0.65 : cellSize*0.15) : cellSize*0.3;
        const ey = dir.y!==0 ? (dir.y>0? cellSize*0.65 : cellSize*0.15) : cellSize*0.3;
        ctx.fillRect(s.x*cellSize+ex, s.y*cellSize+ey, 2, 2);
      } else {
        const bodyColor = invincible ? getCssVar('--special-invincible') : (i%2===0 ? getCssVar('--snake-body') : getCssVar('--snake-shadow'));
        drawCell(s.x,s.y, bodyColor, 2);
      }
    });

    particles.forEach(p=>{
      ctx.globalAlpha = Math.max(p.life,0);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x-2, p.y-2, 4, 4);
    });
    ctx.globalAlpha = 1;
  }

  function loop(ts){
    if (!lastTime) lastTime = ts;
    const dt = ts - lastTime;
    lastTime = ts;

    if (state === 'playing'){
      acc += dt;
      const interval = currentInterval();
      while (acc >= interval){
        step();
        acc -= interval;
        if (state !== 'playing') break;
      }
      updateParticles(dt);
      updateHud();
    }
    draw();
    requestAnimationFrame(loop);
  }

  function startGame(){
    mode = selectedMode;
    reset();
    state = 'playing';
    startOverlay.classList.add('hidden');
    gameoverOverlay.classList.add('hidden');
    pauseOverlay.classList.add('hidden');
    led.style.background = 'var(--snake-head)';
    led.style.boxShadow = '0 0 6px 2px var(--snake-head)';
    lastTime = 0; acc = 0;
  }

  function showStart(){
    state = 'start';
    gameoverOverlay.classList.add('hidden');
    startOverlay.classList.remove('hidden');
  }

  function togglePause(){
    if (state === 'playing'){
      state = 'paused';
      pauseOverlay.classList.remove('hidden');
    } else if (state === 'paused'){
      state = 'playing';
      pauseOverlay.classList.add('hidden');
      lastTime = 0;
    }
  }

  function selectMode(m){
    selectedMode = m;
    modeClassicBtn.classList.toggle('selected', m==='classic');
    modeAdvancedBtn.classList.toggle('selected', m==='advanced');
  }

  function setDirection(nx, ny){
    if (state !== 'playing') return;
    if (snake.length > 1 && nx === -dir.x && ny === -dir.y) return;
    nextDir = {x:nx, y:ny};
  }

  modeClassicBtn.addEventListener('click', ()=>{ selectMode('classic'); startGame(); });
  modeAdvancedBtn.addEventListener('click', ()=>{ selectMode('advanced'); startGame(); });

  window.addEventListener('keydown', (e)=>{
    const k = e.key.toLowerCase();
    if (['arrowup','arrowdown','arrowleft','arrowright',' ','w','a','s','d','enter'].includes(k)){
      e.preventDefault();
    }
    if (state === 'start'){
      if (k==='arrowup'||k==='arrowdown'||k==='w'||k==='s'){
        selectMode(selectedMode==='classic' ? 'advanced' : 'classic');
        return;
      }
      if (k===' '||k==='enter') return startGame();
      return;
    }
    if (state === 'gameover' && (k===' '||k==='enter')) return showStart();

    if (k===' '){ return togglePause(); }

    if (k==='arrowup'||k==='w') setDirection(0,-1);
    else if (k==='arrowdown'||k==='s') setDirection(0,1);
    else if (k==='arrowleft'||k==='a') setDirection(-1,0);
    else if (k==='arrowright'||k==='d') setDirection(1,0);
  });

  let touchStartX=0, touchStartY=0, lastTapTime=0;
  screenEl.addEventListener('touchstart', (e)=>{
    if (e.target.closest('.mode-btn')) return;
    const t = e.changedTouches[0];
    touchStartX = t.clientX; touchStartY = t.clientY;
  }, {passive:true});

  screenEl.addEventListener('touchmove', (e)=>{
    if (e.target.closest('.mode-btn')) return;
    e.preventDefault();
  }, {passive:false});

  screenEl.addEventListener('touchend', (e)=>{
    if (e.target.closest('.mode-btn')) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStartX;
    const dy = t.clientY - touchStartY;
    const absX = Math.abs(dx), absY = Math.abs(dy);
    const threshold = 20;
    const isTap = Math.max(absX,absY) < threshold;
    const now = performance.now();

    if (state === 'gameover'){ if (isTap) showStart(); return; }
    if (state === 'start'){ return; }

    if (isTap){
      if (now - lastTapTime < 350){
        togglePause();
        lastTapTime = 0;
      } else {
        lastTapTime = now;
      }
      return;
    }

    if (state === 'paused') return;

    if (absX > absY){
      setDirection(dx>0?1:-1, 0);
    } else {
      setDirection(0, dy>0?1:-1);
    }
  }, {passive:true});

  pauseBtn.addEventListener('click', ()=>{
    if (state==='playing' || state==='paused') togglePause();
  });

  function focusGame(){
    try { screenEl.focus({preventScroll:true}); } catch(e){ try{ screenEl.focus(); }catch(e2){} }
  }
  window.addEventListener('load', focusGame);
  window.addEventListener('pageshow', focusGame);
  document.addEventListener('click', focusGame);
  document.addEventListener('touchstart', focusGame, {passive:true});
  focusGame();

  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
